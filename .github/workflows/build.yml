name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  GO_VER: 1.26.3
  PROTOC_VER: "33.1"
  PROTOC_GEN_GO_VER: v1.36.10

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout Code

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VER }}

      - name: Install Protoc
        run: |
          curl -fL --retry 3 -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${{ env.PROTOC_VER }}/protoc-${{ env.PROTOC_VER }}-linux-x86_64.zip"
          # update this hash whenever PROTOC_VER is bumped
          echo "f3340e28a83d1c637d8bafdeed92b9f7db6a384c26bca880a6e5217b40a4328b  /tmp/protoc.zip" | sha256sum -c -
          unzip -o /tmp/protoc.zip -d "$HOME/protoc" 'bin/*' 'include/*'
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      - name: check go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: check vendor
        run: |
          go mod vendor
          git diff --exit-code

      - name: go fmt
        run: |
          go fmt ./...
          git diff --exit-code

      - name: goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          goimports -l -w `find . -name '*.go' | grep -v vendor | grep -v 'pb.go'`
          git diff --exit-code

      - name: check protobuf
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VER }}
          protoc --go_opt=paths=source_relative --go_out=. smartbftprotos/*.proto
          protoc --go_opt=paths=source_relative --go_out=. examples/naive_chain/*.proto
          protoc --go_opt=paths=source_relative --go_out=. test/*.proto
          git diff --exit-code

  build:
    needs:
      - validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      name: Checkout Code

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VER }}

    - name: Test
      run: |
        go test -count 1 -race ./...
